<main><h1>第三轮图纸对照</h1><p>五张原图与对应模型视图。材质、灯光及图纸未标注的细部为展示设定。</p><section><h2>一层平面</h2><p>两户餐厅各12座，乙户厨房台面按图靠西墙。餐厅侧门与天井之间的标高衔接图中未标。</p><div class="pair"><figure><a href="../downloads/original-floor-1.pdf"><img src="./source-31.png" alt="原图 31 · 点击打开 PDF" loading="lazy"></a><figcaption>原图 31 · 点击打开 PDF</figcaption></figure><figure><a href="../renders/floor1-day.png"><img src="../renders/floor1-day.png" alt="v7 模型 · 一层平面" loading="lazy"></a><figcaption>v7 模型 · 一层平面</figcaption></figure></div></section><section><h2>二层平面</h2><p>两处露台独立。南端连续部分作前廊盖板和砖栏板。转角通道保留图上踏步线，高差待确认。</p><div class="pair"><figure><a href="../downloads/original-floor-2.pdf"><img src="./source-32.png" alt="原图 32 · 点击打开 PDF" loading="lazy"></a><figcaption>原图 32 · 点击打开 PDF</figcaption></figure><figure><a href="../renders/floor2-day.png"><img src="../renders/floor2-day.png" alt="v7 模型 · 二层平面" loading="lazy"></a><figcaption>v7 模型 · 二层平面</figcaption></figure></div></section><section><h2>三层平面</h2><p>每户三卧两卫。南侧虚线与屋面轮廓属于下层投影，三层无阳台。</p><div class="pair"><figure><a href="../downloads/original-floor-3.pdf"><img src="./source-33.png" alt="原图 33 · 点击打开 PDF" loading="lazy"></a><figcaption>原图 33 · 点击打开 PDF</figcaption></figure><figure><a href="../renders/floor3-day.png"><img src="../renders/floor3-day.png" alt="v7 模型 · 三层平面" loading="lazy"></a><figcaption>v7 模型 · 三层平面</figcaption></figure></div></section><section><h2>屋顶平面</h2><p>连续主脊与两侧山墙按屋顶图定位。谷线按实际坡面交接调整。</p><div class="pair"><figure><a href="../downloads/original-roof.pdf"><img src="./source-34.png" alt="原图 34 · 点击打开 PDF" loading="lazy"></a><figcaption>原图 34 · 点击打开 PDF</figcaption></figure><figure><a href="../renders/roof-day.png"><img src="../renders/roof-day.png" alt="v7 模型 · 屋顶平面" loading="lazy"></a><figcaption>v7 模型 · 屋顶平面</figcaption></figure></div></section><section><h2>南立面</h2><p>南窗标高、连窗分格和实体带按立面表现。右侧连窗宽度按各层平面，首层2.10米，二层约2.40米。</p><div class="pair"><figure><a href="../downloads/original-elevation.pdf"><img src="./source-35.png" alt="原图 35 · 点击打开 PDF" loading="lazy"></a><figcaption>原图 35 · 点击打开 PDF</figcaption></figure><figure><a href="../renders/south-elevation-day.png"><img src="../renders/south-elevation-day.png" alt="v7 模型 · 南立面" loading="lazy"></a><figcaption>v7 模型 · 南立面</figcaption></figure></div></section></main></body></html>
